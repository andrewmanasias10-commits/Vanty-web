<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 142 1108 558" font-family="Inter, Arial, sans-serif">
  <style>
    .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s ease forwards .3s}
    @keyframes draw{to{stroke-dashoffset:0}}
    .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.22,1,.36,1) forwards .8s}
    @keyframes grow{to{transform:scaleX(1)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  </style>
  <defs>
    <linearGradient id="harea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <filter id="hsh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#1b2a52" flood-opacity="0.18"/>
    </filter>
    <clipPath id="twH"><rect x="146" y="349" width="0" height="14"><animate attributeName="width" values="0;0;124;124;0" keyTimes="0;0.12;0.5;0.9;1" dur="4.4s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- main product window (light) -->
  <g filter="url(#hsh)">
    <rect x="250" y="170" width="700" height="470" rx="20" fill="#ffffff"/>
  </g>
  <rect x="250" y="170" width="700" height="52" rx="20" fill="#f4f6fb"/>
  <rect x="250" y="198" width="700" height="24" fill="#f4f6fb"/>
  <circle cx="284" cy="196" r="6" fill="#ff5f57"/><circle cx="306" cy="196" r="6" fill="#febc2e"/><circle cx="328" cy="196" r="6" fill="#28c840"/>
  <rect x="500" y="183" width="200" height="26" rx="13" fill="#e6ebf4"/><text x="600" y="201" fill="#9aa3b5" font-size="11" text-anchor="middle">app.vanty.xyz</text>

  <rect x="250" y="222" width="170" height="418" fill="#0c1838"/>
  <circle cx="284" cy="262" r="10" fill="#1D4ED8"/><text x="302" y="267" fill="#fff" font-size="12" font-weight="700">VANTY</text>
  <rect x="270" y="300" width="130" height="30" rx="8" fill="#1D4ED8"/>
  <rect x="282" y="352" width="92" height="9" rx="4" fill="#33406b"/>
  <rect x="282" y="384" width="108" height="9" rx="4" fill="#33406b"/>
  <rect x="282" y="416" width="80" height="9" rx="4" fill="#33406b"/>
  <rect x="282" y="448" width="100" height="9" rx="4" fill="#33406b"/>

  <text x="448" y="266" fill="#0b1020" font-size="17" font-weight="800">Panel de control</text>
  <rect x="448" y="286" width="150" height="82" rx="12" fill="#f6f8fc" stroke="#eef1f6"/>
  <text x="466" y="314" fill="#5b647a" font-size="11">Eficiencia</text><text x="466" y="348" fill="#0b1020" font-size="24" font-weight="800">+38%</text>
  <rect x="612" y="286" width="150" height="82" rx="12" fill="#f6f8fc" stroke="#eef1f6"/>
  <text x="630" y="314" fill="#5b647a" font-size="11">Tareas auto.</text><text x="630" y="348" fill="#1D4ED8" font-size="24" font-weight="800">1.2k</text>
  <rect x="776" y="286" width="150" height="82" rx="12" fill="#eef6ff" stroke="#dbe6fb"/>
  <text x="794" y="314" fill="#1e40af" font-size="11">Tiempo ahorro</text><text x="794" y="348" fill="#1D4ED8" font-size="24" font-weight="800">9h</text>

  <rect x="448" y="384" width="478" height="232" rx="13" fill="#ffffff" stroke="#eef1f6"/>
  <text x="468" y="416" fill="#0b1020" font-size="13" font-weight="700">Rendimiento operativo</text>
  <g stroke="#eef1f6" stroke-width="1.5"><line x1="468" y1="448" x2="906" y2="448"/><line x1="468" y1="508" x2="906" y2="508"/><line x1="468" y1="568" x2="906" y2="568"/></g>
  <path d="M468 560 L540 524 L612 538 L684 482 L756 452 L828 416 L906 388 L906 588 L468 588 Z" fill="url(#harea)"/>
  <polyline class="ln" pathLength="1" points="468,560 540,524 612,538 684,482 756,452 828,416 906,388" fill="none" stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- floating card: agente IA -->
  <g filter="url(#hsh)"><rect x="70" y="300" width="250" height="120" rx="18" fill="#ffffff"/></g>
  <circle class="pulse" cx="112" cy="344" r="20" fill="#1D4ED8"/><path d="M104 350 q8 -16 16 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="106" cy="340" r="2.4" fill="#fff"/><circle cx="118" cy="340" r="2.4" fill="#fff"/>
  <text x="146" y="338" fill="#0b1020" font-size="14" font-weight="700">Agente inteligente</text>
  <text x="146" y="358" fill="#5b647a" font-size="11" clip-path="url(#twH)">Automatiza lo repetitivo</text>
  <rect x="96" y="378" width="200" height="8" rx="4" fill="#dbe6fb"/><rect class="bar" x="96" y="378" width="160" height="8" rx="4" fill="#1D4ED8"/>

  <!-- floating card: seguridad -->
  <g filter="url(#hsh)"><rect x="880" y="540" width="240" height="120" rx="18" fill="#ffffff"/></g>
  <rect x="906" y="566" width="40" height="40" rx="11" fill="#ecfdf5"/><path d="M926 574 l14 6 v8 q0 12 -14 18 q-14 -6 -14 -18 v-8 z" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="960" y="582" fill="#0b1020" font-size="14" font-weight="700">Seguro por diseño</text>
  <text x="960" y="602" fill="#9aa3b5" font-size="11">Datos protegidos</text>
  <text x="906" y="640" fill="#16a34a" font-size="12" font-weight="700">99.9% disponibilidad</text>
</svg>
