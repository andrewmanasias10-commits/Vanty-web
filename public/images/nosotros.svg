    <rect x="180" y="360" width="150" height="52" rx="26" fill="#13224d" stroke="#26356b"/><text x="255" y="392" fill="#bcd3ff" text-anchor="middle">🩺 Salud</text>
    <rect x="150" y="470" width="180" height="52" rx="26" fill="#13224d" stroke="#26356b"/><text x="240" y="502" fill="#bcd3ff" text-anchor="middle">🎓 Educación</text>
    <rect x="860" y="330" width="160" height="52" rx="26" fill="#13224d" stroke="#26356b"/><text x="940" y="362" fill="#c4b5fd" text-anchor="middle">🤖 IA aplicada</text>
    <rect x="880" y="450" width="170" height="52" rx="26" fill="#13224d" stroke="#26356b"/><text x="965" y="482" fill="#c4b5fd" text-anchor="middle">💜 Bienestar</text>
  </g>

  <!-- connecting dots -->
  <g stroke="#3a4a85" stroke-width="2" stroke-dasharray="2 8" opacity="0.6">
    <line x1="330" y1="386" x2="500" y2="410"/>
    <line x1="330" y1="496" x2="500" y2="470"/>
    <line x1="860" y1="356" x2="700" y2="410"/>
    <line x1="880" y1="476" x2="700" y2="470"/>
