<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Vanty">
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1aa9ff"/>
      <stop offset="0.5" stop-color="#1565ee"/>
      <stop offset="1" stop-color="#0b41c8"/>
    </linearGradient>
    <filter id="vsh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#06205e" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#vg)"/>
  <!-- marca V interlazada (outer V + loop interno) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" filter="url(#vsh)">
    <!-- V exterior -->
    <path d="M58 72 L128 196 L198 72" stroke-width="26"/>
    <!-- bucle interno que se entrelaza -->
    <path d="M104 72 L104 150 a24 24 0 0 0 48 0 L152 72" stroke-width="22"/>
  </g>
</svg>
