<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Inter, Arial, sans-serif">
  <style>
    .rise{opacity:0;transform:translateY(10px);animation:rise .55s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes rise{to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes pop{to{transform:scale(1)}}
    .cur{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
    .clip{animation:type 2.4s steps(20) forwards .5s}@keyframes type{to{width:150px}}
    .pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  </style>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1b2a52" flood-opacity="0.16"/></filter>
  <clipPath id="q"><rect x="250" y="120" width="0" height="22" class="clip"/></clipPath></defs>

  <rect x="20" y="20" width="720" height="480" rx="20" fill="#ffffff" stroke="#e6ebf4" filter="url(#s)"/>
  <rect x="20" y="20" width="720" height="58" rx="20" fill="#0c1838"/><rect x="20" y="48" width="720" height="30" fill="#0c1838"/>
  <circle cx="48" cy="49" r="5" fill="#ff5f57"/><circle cx="66" cy="49" r="5" fill="#febc2e"/><circle cx="84" cy="49" r="5" fill="#28c840"/>
  <text x="120" y="54" fill="#fff" font-size="14" font-weight="700">Evaluación inicial · Mateo G.</text>

  <!-- CIE-11 search -->
  <text x="44" y="112" fill="#8a93a6" font-size="11" font-weight="700">BUSCADOR CIE-11</text>
  <rect x="44" y="122" width="672" height="42" rx="12" fill="#f6f8fc" stroke="#e3e8f2"/>
  <circle cx="68" cy="143" r="7" fill="none" stroke="#8a93a6" stroke-width="2"/><line x1="73" y1="148" x2="79" y2="154" stroke="#8a93a6" stroke-width="2"/>
  <text x="250" y="137" fill="#0b1020" font-size="12.5" clip-path="url(#q)">Trastorno del espectro autista</text>
  <rect x="250" y="120" width="2" height="22" fill="#1257e6" class="cur"/>
  <text x="92" y="147" fill="#b9c2d4" font-size="12.5">Buscar diagnóstico…</text>
  <!-- result -->
  <g class="pop" style="animation-delay:1.6s"><rect x="44" y="172" width="672" height="40" rx="10" fill="#eaf3ff" stroke="#cfe0fb"/>
    <rect x="58" y="184" width="40" height="16" rx="5" fill="#1257e6"/><text x="78" y="196" fill="#fff" font-size="9.5" font-weight="800" text-anchor="middle">6A02</text>
    <text x="112" y="197" fill="#0b1020" font-size="12" font-weight="600">Trastorno del espectro autista · CIE-11</text>
    <path d="M690 192 l5 5 l10 -11" stroke="#16a34a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- assessment domains -->
  <text x="44" y="252" fill="#0b1020" font-size="13" font-weight="700">Áreas evaluadas</text>
  <g font-size="11">
    <text x="44" y="284" fill="#5b647a">Comunicación</text><rect x="200" y="276" width="360" height="10" rx="5" fill="#eef1f6"/><rect class="bar" style="animation-delay:.6s" x="200" y="276" width="250" height="10" rx="5" fill="#1257e6"/><text x="690" y="285" fill="#0b1020" font-weight="800" text-anchor="end">70%</text>
    <text x="44" y="316" fill="#5b647a">Habilidades sociales</text><rect x="200" y="308" width="360" height="10" rx="5" fill="#eef1f6"/><rect class="bar" style="animation-delay:.74s" x="200" y="308" width="190" height="10" rx="5" fill="#16a6ff"/><text x="690" y="317" fill="#0b1020" font-weight="800" text-anchor="end">53%</text>
    <text x="44" y="348" fill="#5b647a">Autonomía</text><rect x="200" y="340" width="360" height="10" rx="5" fill="#eef1f6"/><rect class="bar" style="animation-delay:.88s" x="200" y="340" width="300" height="10" rx="5" fill="#0f766e"/><text x="690" y="349" fill="#0b1020" font-weight="800" text-anchor="end">83%</text>
    <text x="44" y="380" fill="#5b647a">Motor</text><rect x="200" y="372" width="360" height="10" rx="5" fill="#eef1f6"/><rect class="bar" style="animation-delay:1.02s" x="200" y="372" width="230" height="10" rx="5" fill="#7c3aed"/><text x="690" y="381" fill="#0b1020" font-weight="800" text-anchor="end">64%</text>
  </g>

  <!-- AI suggestion -->
  <g class="rise" style="animation-delay:1.2s"><rect x="44" y="404" width="672" height="64" rx="12" fill="#0c1838"/>
    <circle cx="76" cy="436" r="16" fill="#1257e6" class="pulse"/><text x="76" y="440" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">IA</text>
    <text x="104" y="430" fill="#fff" font-size="11.5" font-weight="700">Objetivos sugeridos por ARIA</text>
    <text x="104" y="448" fill="#8ea3d6" font-size="10.5">12 objetivos ABA propuestos según la evaluación</text>
    <rect x="612" y="420" width="88" height="32" rx="9" fill="#1257e6"/><text x="656" y="440" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Aplicar</text></g>
</svg>
