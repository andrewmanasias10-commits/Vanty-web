<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Inter, Arial, sans-serif">
  <style>
    .rise{opacity:0;transform:translateY(10px);animation:rise .55s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes rise{to{opacity:1;transform:none}}
    .pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes pop{to{transform:scale(1)}}
    .pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .orb{transform-box:fill-box;transform-origin:center;animation:orb 3s ease-in-out infinite}@keyframes orb{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    .dot{animation:blink 1.2s ease-in-out infinite}@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
    .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1s cubic-bezier(.22,1,.36,1) forwards}@keyframes grow{to{transform:scaleX(1)}}
    .cur{animation:cb 1s step-end infinite}@keyframes cb{50%{opacity:0}}
  </style>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1b2a52" flood-opacity="0.16"/></filter>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1aa9ff"/><stop offset="1" stop-color="#0b41c8"/></linearGradient>
    <clipPath id="ttl"><rect x="430" y="250" width="0" height="16"><animate attributeName="width" values="0;0;235" keyTimes="0;.25;.85" dur="3.6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="ttl2"><rect x="430" y="276" width="0" height="16"><animate attributeName="width" values="0;0;210" keyTimes="0;.45;.95" dur="3.6s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect x="20" y="20" width="720" height="480" rx="20" fill="#ffffff" stroke="#e6ebf4" filter="url(#s)"/>
  <rect x="20" y="20" width="720" height="58" rx="20" fill="#0c1838"/><rect x="20" y="48" width="720" height="30" fill="#0c1838"/>
  <circle cx="48" cy="49" r="5" fill="#ff5f57"/><circle cx="66" cy="49" r="5" fill="#febc2e"/><circle cx="84" cy="49" r="5" fill="#28c840"/>
  <g><circle cx="120" cy="49" r="11" fill="url(#g)" class="orb"/><text x="120" y="53" fill="#fff" font-size="9" font-weight="800" text-anchor="middle">AI</text></g>
  <text x="142" y="53" fill="#fff" font-size="13.5" font-weight="700">ARIA · Copiloto clínico</text>

  <!-- LEFT: chat -->
  <rect x="40" y="98" width="368" height="382" rx="14" fill="#f6f8fc" stroke="#eef1f6"/>
  <!-- user message -->
  <g class="rise" style="animation-delay:.2s"><rect x="150" y="116" width="240" height="44" rx="12" fill="#1257e6"/><text x="170" y="135" fill="#fff" font-size="11" font-weight="600">Genera la nota de Mateo G.</text><text x="170" y="150" fill="#bcd3ff" font-size="9.5">sesión de hoy · lenguaje</text></g>
  <!-- ARIA reply with orb -->
  <g class="rise" style="animation-delay:.6s">
    <circle cx="72" cy="190" r="16" fill="url(#g)"/><text x="72" y="194" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">AI</text>
    <rect x="98" y="174" width="290" height="92" rx="12" fill="#fff" stroke="#e6ebf4"/>
    <text x="114" y="196" fill="#0b1020" font-size="11" font-weight="700">Nota de sesión generada</text>
    <rect x="114" y="208" width="250" height="7" rx="3.5" fill="#e6ebf4"/><rect class="bar" style="animation-delay:.9s" x="114" y="208" width="250" height="7" rx="3.5" fill="#dbe6fb"/>
    <rect x="114" y="224" width="210" height="7" rx="3.5" fill="#eef1f6"/><rect class="bar" style="animation-delay:1.05s" x="114" y="224" width="210" height="7" rx="3.5" fill="#dbe6fb"/>
    <rect x="114" y="240" width="160" height="7" rx="3.5" fill="#eef1f6"/><rect class="bar" style="animation-delay:1.2s" x="114" y="240" width="160" height="7" rx="3.5" fill="#dbe6fb"/>
  </g>
  <!-- suggestion chips -->
  <g class="pop" style="animation-delay:1.5s"><rect x="98" y="282" width="92" height="28" rx="14" fill="#eaf3ff" stroke="#cfe0fb"/><text x="144" y="300" fill="#1257e6" font-size="10" font-weight="700" text-anchor="middle">+ Objetivos</text></g>
  <g class="pop" style="animation-delay:1.7s"><rect x="198" y="282" width="86" height="28" rx="14" fill="#ecfdf5" stroke="#c7efdb"/><text x="241" y="300" fill="#16a34a" font-size="10" font-weight="700" text-anchor="middle">Resumen</text></g>
  <g class="pop" style="animation-delay:1.9s"><rect x="292" y="282" width="80" height="28" rx="14" fill="#fde6ef" stroke="#f8cdd9"/><text x="332" y="300" fill="#e11d6b" font-size="10" font-weight="700" text-anchor="middle">Alertas</text></g>
  <!-- typing -->
  <g class="rise" style="animation-delay:2.1s"><circle cx="72" cy="340" r="16" fill="url(#g)"/><text x="72" y="344" fill="#fff" font-size="10" font-weight="800" text-anchor="middle">AI</text>
    <rect x="98" y="326" width="92" height="30" rx="12" fill="#fff" stroke="#e6ebf4"/>
    <circle cx="122" cy="341" r="4" fill="#1257e6" class="dot"/><circle cx="138" cy="341" r="4" fill="#1257e6" class="dot" style="animation-delay:.2s"/><circle cx="154" cy="341" r="4" fill="#1257e6" class="dot" style="animation-delay:.4s"/></g>
  <!-- input -->
  <rect x="56" y="436" width="336" height="34" rx="12" fill="#fff" stroke="#e3e8f2"/><text x="74" y="457" fill="#b9c2d4" font-size="11">Pregúntale a ARIA…</text>
  <circle cx="372" cy="453" r="13" fill="url(#g)"/><path d="M367 453h9 M372 449l4 4-4 4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- RIGHT: generated note preview -->
  <rect x="424" y="98" width="296" height="382" rx="14" fill="#0c1838"/>
  <text x="444" y="128" fill="#aab6d4" font-size="11" font-weight="700">VISTA PREVIA · NOTA CLÍNICA</text>
  <rect x="444" y="142" width="256" height="86" rx="12" fill="#13235e"/>
  <circle cx="468" cy="166" r="12" fill="url(#g)" class="pulse"/>
  <text x="488" y="163" fill="#fff" font-size="11" font-weight="700">Mateo G. · Lenguaje</text>
  <text x="488" y="178" fill="#8ea3d6" font-size="9.5">Objetivo: peticiones espontáneas</text>
  <rect x="488" y="190" width="180" height="6" rx="3" fill="#1b2a52"/><rect class="bar" style="animation-delay:1s" x="488" y="190" width="150" height="6" rx="3" fill="#16a6ff"/>
  <text x="660" y="178" fill="#16a6ff" font-size="11" font-weight="800" text-anchor="end">85%</text>

  <!-- typewriter lines -->
  <text x="444" y="262" fill="#cfe0fb" font-size="11.5" clip-path="url(#ttl)">El paciente respondió a 17 de 20 ensayos</text>
  <text x="444" y="288" fill="#cfe0fb" font-size="11.5" clip-path="url(#ttl2)">con apoyo verbal mínimo. Se sugiere…</text>
  <rect x="444" y="294" width="2" height="14" fill="#16a6ff" class="cur"/>

  <!-- mini chart -->
  <g class="rise" style="animation-delay:1.4s">
    <rect x="444" y="320" width="256" height="96" rx="12" fill="#13235e"/>
    <text x="460" y="342" fill="#aab6d4" font-size="9.5">Progreso del objetivo</text>
    <polyline points="462,398 500,388 540,392 580,372 620,360 660,344 686,336" fill="none" stroke="#16a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;0" dur="1.4s" begin="1.6s" fill="freeze"/></polyline>
  </g>
  <!-- done badge -->
  <g class="pop" style="animation-delay:2.4s"><rect x="444" y="430" width="150" height="34" rx="10" fill="#0e3b27"/><circle cx="466" cy="447" r="9" fill="#16a34a"/><path d="M461 447l4 4 7 -8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="482" y="451" fill="#7ee2a8" font-size="10.5" font-weight="700">Listo en 8 s</text></g>
</svg>
