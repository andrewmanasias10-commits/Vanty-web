<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Inter, Arial, sans-serif">
  <style>
    .rise{opacity:0;transform:translateY(10px);animation:rise .55s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes rise{to{opacity:1;transform:none}}
    .pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes pop{to{transform:scale(1)}}
    .pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    .clip{animation:type 2.2s steps(22) forwards 1.4s}@keyframes type{to{width:150px}}
    .cur{opacity:0;animation:show 0s linear forwards 1.4s, blink 1s step-end infinite 1.4s}@keyframes show{to{opacity:1}}@keyframes blink{50%{opacity:0}}
  </style>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1b2a52" flood-opacity="0.16"/></filter>
  <clipPath id="t"><rect x="250" y="430" width="0" height="20" class="clip"/></clipPath></defs>

  <rect x="20" y="20" width="720" height="480" rx="20" fill="#ffffff" stroke="#e6ebf4" filter="url(#s)"/>
  <rect x="20" y="20" width="720" height="58" rx="20" fill="#0c1838"/><rect x="20" y="48" width="720" height="30" fill="#0c1838"/>
  <circle cx="48" cy="49" r="5" fill="#ff5f57"/><circle cx="66" cy="49" r="5" fill="#febc2e"/><circle cx="84" cy="49" r="5" fill="#28c840"/>
  <text x="120" y="54" fill="#fff" font-size="14" font-weight="700">Comunicación · Mateo G.</text>

  <!-- chat thread -->
  <rect x="40" y="98" width="430" height="382" rx="14" fill="#f6f8fc" stroke="#eef1f6"/>
  <text x="60" y="126" fill="#8a93a6" font-size="11" font-weight="700">EQUIPO CLÍNICO</text>
  <!-- incoming -->
  <g class="rise" style="animation-delay:.3s"><rect x="60" y="140" width="240" height="48" rx="12" fill="#fff" stroke="#eef1f6"/><rect x="74" y="154" width="150" height="7" rx="3" fill="#e6ebf4"/><rect x="74" y="168" width="110" height="7" rx="3" fill="#eef1f6"/></g>
  <!-- outgoing blue -->
  <g class="rise" style="animation-delay:.6s"><rect x="210" y="200" width="240" height="48" rx="12" fill="#1257e6"/><rect x="224" y="214" width="160" height="7" rx="3" fill="#9ec6ff"/><rect x="224" y="228" width="120" height="7" rx="3" fill="#7fb4ff"/></g>
  <!-- incoming -->
  <g class="rise" style="animation-delay:.9s"><rect x="60" y="260" width="220" height="48" rx="12" fill="#fff" stroke="#eef1f6"/><rect x="74" y="274" width="130" height="7" rx="3" fill="#e6ebf4"/><rect x="74" y="288" width="90" height="7" rx="3" fill="#eef1f6"/></g>
  <!-- typing dots -->
  <g class="rise" style="animation-delay:1.15s"><rect x="60" y="322" width="70" height="34" rx="12" fill="#fff" stroke="#eef1f6"/>
    <circle cx="80" cy="339" r="4" fill="#b9c2d4" class="pulse"/><circle cx="95" cy="339" r="4" fill="#b9c2d4" class="pulse" style="animation-delay:.2s"/><circle cx="110" cy="339" r="4" fill="#b9c2d4" class="pulse" style="animation-delay:.4s"/></g>
  <!-- input with typewriter -->
  <rect x="60" y="424" width="390" height="38" rx="12" fill="#fff" stroke="#e3e8f2"/>
  <text x="250" y="445" fill="#0b1020" font-size="12" clip-path="url(#t)">Reporte enviado a la familia</text>
  <rect x="250" y="430" width="2" height="18" fill="#1257e6" class="cur"/>
  <text x="80" y="447" fill="#b9c2d4" font-size="12">Escribe un mensaje…</text>

  <!-- WhatsApp notification panel -->
  <rect x="488" y="98" width="232" height="382" rx="14" fill="#ffffff" stroke="#eef1f6"/>
  <rect x="488" y="98" width="232" height="56" rx="14" fill="#25D366"/><rect x="488" y="126" width="232" height="28" fill="#25D366"/>
  <circle cx="516" cy="126" r="13" fill="#fff"/><path d="M510 126a6 6 0 1 1 3 5l-4 1 1-3a6 6 0 0 1 0-3z" fill="#25D366"/>
  <text x="538" y="123" fill="#fff" font-size="12" font-weight="800">WhatsApp</text><text x="538" y="138" fill="#d6ffe6" font-size="9.5">Familias notificadas</text>

  <g class="pop" style="animation-delay:1.0s"><rect x="504" y="172" width="200" height="62" rx="12" fill="#ecfdf5" stroke="#c7efdb"/>
    <text x="518" y="194" fill="#0b3b27" font-size="10.5" font-weight="700">Recordatorio de sesión</text>
    <text x="518" y="210" fill="#3b6b54" font-size="9.5">Mañana 10:00 · Lenguaje</text>
    <text x="518" y="225" fill="#16a34a" font-size="9" font-weight="700">Entregado ✓✓</text></g>
  <g class="pop" style="animation-delay:1.4s"><rect x="504" y="246" width="200" height="62" rx="12" fill="#ecfdf5" stroke="#c7efdb"/>
    <text x="518" y="268" fill="#0b3b27" font-size="10.5" font-weight="700">Reporte semanal listo</text>
    <text x="518" y="284" fill="#3b6b54" font-size="9.5">Progreso de Mateo G.</text>
    <text x="518" y="299" fill="#16a34a" font-size="9" font-weight="700">Entregado ✓✓</text></g>
  <g class="pop" style="animation-delay:1.8s"><rect x="504" y="320" width="200" height="62" rx="12" fill="#f6f8fc" stroke="#eef1f6"/>
    <text x="518" y="342" fill="#0b1020" font-size="10.5" font-weight="700">Actividad para casa</text>
    <text x="518" y="358" fill="#5b647a" font-size="9.5">Enviada a la familia</text>
    <text x="518" y="373" fill="#8a93a6" font-size="9" font-weight="700">Enviando…</text></g>
</svg>
