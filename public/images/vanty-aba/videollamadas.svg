<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Inter, Arial, sans-serif">
  <style>
    .rise{opacity:0;transform:translateY(10px);animation:rise .55s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes rise{to{opacity:1;transform:none}}
    .pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes pop{to{transform:scale(1)}}
    .rec{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .wave{transform-box:fill-box;transform-origin:bottom;animation:wv 1.1s ease-in-out infinite alternate}
    @keyframes wv{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
  </style>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1b2a52" flood-opacity="0.16"/></filter></defs>

  <rect x="20" y="20" width="720" height="480" rx="20" fill="#ffffff" stroke="#e6ebf4" filter="url(#s)"/>
  <rect x="20" y="20" width="720" height="58" rx="20" fill="#0c1838"/><rect x="20" y="48" width="720" height="30" fill="#0c1838"/>
  <circle cx="48" cy="49" r="5" fill="#ff5f57"/><circle cx="66" cy="49" r="5" fill="#febc2e"/><circle cx="84" cy="49" r="5" fill="#28c840"/>
  <text x="120" y="54" fill="#fff" font-size="14" font-weight="700">Videollamada · Sesión remota</text>
  <g><circle cx="650" cy="49" r="5" fill="#ff5f57" class="rec"/><text x="664" y="53" fill="#ff8079" font-size="11" font-weight="700">REC</text></g>

  <!-- main video -->
  <rect x="44" y="98" width="470" height="320" rx="16" fill="#0f1b3d"/>
  <circle cx="279" cy="228" r="58" fill="#1b2a52"/><circle cx="279" cy="205" r="22" fill="#3b5a9e"/><path d="M243 268a36 30 0 0 1 72 0z" fill="#3b5a9e"/>
  <rect x="60" y="388" width="150" height="22" rx="8" fill="rgba(0,0,0,.4)"/><text x="74" y="403" fill="#fff" font-size="11" font-weight="600">Terapeuta · Francesca</text>
  <!-- audio bars -->
  <g fill="#16a6ff"><rect class="wave" x="430" y="378" width="6" height="24" rx="3"/><rect class="wave" x="442" y="372" width="6" height="30" rx="3" style="animation-delay:.15s"/><rect class="wave" x="454" y="382" width="6" height="20" rx="3" style="animation-delay:.3s"/><rect class="wave" x="466" y="368" width="6" height="34" rx="3" style="animation-delay:.45s"/><rect class="wave" x="478" y="380" width="6" height="22" rx="3" style="animation-delay:.6s"/></g>

  <!-- participant tile -->
  <g class="rise" style="animation-delay:.4s"><rect x="528" y="98" width="188" height="150" rx="14" fill="#13235e"/>
    <circle cx="622" cy="160" r="34" fill="#1b2a52"/><circle cx="622" cy="148" r="13" fill="#e0959c"/><path d="M601 184a21 18 0 0 1 42 0z" fill="#e0959c"/>
    <rect x="540" y="222" width="120" height="16" rx="6" fill="rgba(0,0,0,.35)"/><text x="550" y="234" fill="#fff" font-size="10" font-weight="600">Familia Gómez</text></g>

  <!-- session data panel -->
  <g class="rise" style="animation-delay:.6s"><rect x="528" y="262" width="188" height="156" rx="14" fill="#f6f8fc" stroke="#eef1f6"/>
    <text x="546" y="286" fill="#0b1020" font-size="11" font-weight="700">Registro en vivo</text>
    <rect x="546" y="298" width="150" height="8" rx="4" fill="#dbe6fb"/><rect x="546" y="316" width="120" height="8" rx="4" fill="#e6ebf4"/><rect x="546" y="334" width="140" height="8" rx="4" fill="#e6ebf4"/>
    <rect x="546" y="360" width="152" height="40" rx="10" fill="#eaf3ff"/><text x="560" y="378" fill="#1257e6" font-size="10" font-weight="700">Datos guardados</text><text x="560" y="392" fill="#5b7bbd" font-size="9">en el historial del paciente</text></g>

  <!-- controls -->
  <g class="pop" style="animation-delay:.9s">
    <rect x="180" y="442" width="200" height="46" rx="23" fill="#0c1838"/>
    <circle cx="214" cy="465" r="15" fill="#1b2a52"/><rect x="207" y="459" width="14" height="12" rx="3" fill="#cfe0fb"/>
    <circle cx="256" cy="465" r="15" fill="#1b2a52"/><path d="M250 460h8a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3z" fill="#cfe0fb"/><path d="M264 463l6-3v10l-6-3z" fill="#cfe0fb"/>
    <circle cx="298" cy="465" r="15" fill="#1b2a52"/><circle cx="298" cy="465" r="6" fill="#cfe0fb"/>
    <rect x="324" y="452" width="44" height="26" rx="13" fill="#ff5f57"/><path d="M338 470c-2-6 14-6 12 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
