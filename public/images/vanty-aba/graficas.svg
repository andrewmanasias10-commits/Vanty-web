<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, Arial, sans-serif">
  <style>
    .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.9s ease forwards .3s}
    @keyframes draw{to{stroke-dashoffset:0}}
    .vbar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:growY 1s cubic-bezier(.22,1,.36,1) forwards .5s}
    @keyframes growY{to{transform:scaleY(1)}}
    .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.22,1,.36,1) forwards .9s}
    @keyframes grow{to{transform:scaleX(1)}}
    .pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .55s cubic-bezier(.34,1.56,.64,1) forwards .4s}
    @keyframes pop{to{transform:scale(1)}}
  </style>
  <defs>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="gsh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#1b2a52" flood-opacity="0.16"/></filter>
    <clipPath id="twQ1"><rect x="366" y="622" width="0" height="26"><animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.05;0.42;0.92;1" dur="5.5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="twQ2"><rect x="366" y="648" width="0" height="26"><animate attributeName="width" values="0;0;270;270;0" keyTimes="0;0.42;0.72;0.92;1" dur="5.5s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect x="40" y="40" width="1120" height="820" rx="22" fill="#ffffff" stroke="#e3e8f2" stroke-width="2" filter="url(#gsh)"/>

  <!-- top bar -->
  <text x="72" y="92" fill="#0b1020" font-size="22" font-weight="800">Analítica clínica</text>
  <text x="72" y="116" fill="#9aa3b5" font-size="13">Progreso del paciente · Mateo G.</text>
  <rect x="940" y="68" width="92" height="36" rx="10" fill="#f1f4fa"/><text x="986" y="91" fill="#5b647a" font-size="12" text-anchor="middle">Mensual ▾</text>
  <rect x="1044" y="68" width="44" height="36" rx="10" fill="#1D4ED8"/><text x="1066" y="91" fill="#fff" font-size="12" text-anchor="middle">↑</text>

  <!-- big line chart -->
  <rect x="72" y="150" width="680" height="380" rx="16" fill="#fbfcfe" stroke="#eef1f6"/>
  <text x="96" y="188" fill="#0b1020" font-size="15" font-weight="700">Tendencia por dominio</text>
  <g font-size="11" fill="#9aa3b5">
    <text x="96" y="214">100%</text><text x="104" y="448">0%</text>
  </g>
  <g stroke="#eef1f6" stroke-width="1.5">
    <line x1="150" y1="220" x2="720" y2="220"/>
    <line x1="150" y1="290" x2="720" y2="290"/>
    <line x1="150" y1="360" x2="720" y2="360"/>
    <line x1="150" y1="430" x2="720" y2="430"/>
  </g>
  <path d="M150 410 L232 380 L314 392 L396 340 L478 312 L560 270 L642 244 L720 220 L720 430 L150 430 Z" fill="url(#ga)"/>
  <polyline class="ln" pathLength="1" points="150,410 232,380 314,392 396,340 478,312 560,270 642,244 720,220" fill="none" stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle r="5" fill="#1D4ED8"><animateMotion dur="3.6s" begin="1.5s" repeatCount="indefinite" calcMode="linear" path="M150 410 L232 380 L314 392 L396 340 L478 312 L560 270 L642 244 L720 220"/></circle>
  <path d="M150 420 L232 414 L314 400 L396 396 L478 372 L560 360 L642 350 L720 332 L720 430 L150 430 Z" fill="url(#gb)"/>
  <polyline points="150,420 232,414 314,400 396,396 478,372 560,360 642,350 720,332" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="16;0" dur="0.9s" repeatCount="indefinite"/></polyline>
  <g font-size="11" fill="#9aa3b5"><text x="150" y="455">S1</text><text x="314" y="455">S3</text><text x="478" y="455">S5</text><text x="642" y="455">S7</text></g>
  <circle cx="120" cy="495" r="5" fill="#1D4ED8"/><text x="134" y="500" fill="#5b647a" font-size="12">Comunicación</text>
  <circle cx="280" cy="495" r="5" fill="#7c3aed"/><text x="294" y="500" fill="#5b647a" font-size="12">Habilidades sociales</text>

  <!-- alert card -->
  <rect x="772" y="150" width="356" height="180" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle class="pop" cx="808" cy="190" r="18" fill="#16a34a"/><path d="M800 190 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="838" y="186" fill="#065f46" font-size="14" font-weight="800">Objetivo alcanzado</text>
  <text x="838" y="206" fill="#16a34a" font-size="12">Comunicación funcional ≥ 80%</text>
  <text x="796" y="252" fill="#065f46" font-size="44" font-weight="900">85%</text>
  <text x="796" y="286" fill="#16a34a" font-size="12">+13% vs. mes anterior · alerta enviada al equipo</text>

  <!-- bars per objetivo -->
  <rect x="772" y="350" width="356" height="180" rx="16" fill="#fbfcfe" stroke="#eef1f6"/>
  <text x="796" y="386" fill="#0b1020" font-size="14" font-weight="700">Por objetivo</text>
  <g class="vbar">
    <rect x="800" y="420" width="44" height="80" fill="#1D4ED8" rx="6"/>
    <rect x="860" y="446" width="44" height="54" fill="#60a5fa" rx="6"/>
    <rect x="920" y="410" width="44" height="90" fill="#1D4ED8" rx="6"/>
    <rect x="980" y="468" width="44" height="32" fill="#7c3aed" rx="6"/>
    <rect x="1040" y="430" width="44" height="70" fill="#0f766e" rx="6"/>
  </g>
  <line x1="788" y1="500" x2="1112" y2="500" stroke="#e3e8f2" stroke-width="2"/>

  <!-- stat chips -->
  <g>
    <rect x="72" y="556" width="250" height="248" rx="16" fill="#f6f8fc" stroke="#eef1f6"/>
    <text x="96" y="592" fill="#5b647a" font-size="13">Sesiones registradas</text>
    <text x="96" y="640" fill="#0b1020" font-size="40" font-weight="900">142</text>
    <text x="96" y="672" fill="#16a34a" font-size="12" font-weight="700">+18 este mes</text>
    <rect x="96" y="700" width="200" height="9" rx="4.5" fill="#eef1f6"/><rect class="bar" x="96" y="700" width="150" height="9" rx="4.5" fill="#1D4ED8"/>
    <text x="96" y="744" fill="#9aa3b5" font-size="12">Adherencia al programa</text>

    <rect x="342" y="556" width="410" height="248" rx="16" fill="#0c1838"/>
    <text x="368" y="596" fill="#aab6d4" font-size="13">Resumen generado por IA</text>
    <text x="368" y="640" fill="#ffffff" font-size="17" font-weight="700" clip-path="url(#twQ1)">“Mateo muestra avance sostenido</text>
    <text x="368" y="666" fill="#ffffff" font-size="17" font-weight="700" clip-path="url(#twQ2)">en comunicación funcional.”</text>
    <text x="368" y="704" fill="#8ea3d6" font-size="12.5">Se recomienda introducir nuevos objetivos</text>
    <text x="368" y="724" fill="#8ea3d6" font-size="12.5">de interacción social esta semana.</text>
    <rect x="368" y="748" width="120" height="34" rx="10" fill="#1D4ED8"/><text x="428" y="770" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Ver reporte</text>

    <rect x="772" y="556" width="356" height="248" rx="16" fill="#f6f8fc" stroke="#eef1f6"/>
    <text x="796" y="592" fill="#5b647a" font-size="13">Dominios en seguimiento</text>
    <g font-size="13" fill="#0b1020">
      <circle cx="804" cy="630" r="5" fill="#1D4ED8"/><text x="820" y="635">Comunicación — 85%</text>
      <circle cx="804" cy="666" r="5" fill="#0f766e"/><text x="820" y="671">Social — 72%</text>
      <circle cx="804" cy="702" r="5" fill="#7c3aed"/><text x="820" y="707">Motor — 60%</text>
      <circle cx="804" cy="738" r="5" fill="#16a34a"/><text x="820" y="743">Autonomía — 92%</text>
      <circle cx="804" cy="774" r="5" fill="#f59e0b"/><text x="820" y="779">Cognición — 48%</text>
    </g>
  </g>
</svg>
