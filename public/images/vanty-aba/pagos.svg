<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="Inter, Arial, sans-serif">
  <style>
    .rise{opacity:0;transform:translateY(10px);animation:rise .55s cubic-bezier(.22,1,.36,1) forwards}
    @keyframes rise{to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.22,1,.36,1) forwards .5s}
    @keyframes grow{to{transform:scaleX(1)}}
    .pop{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes pop{to{transform:scale(1)}}
    .cur{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
    .clip{animation:wipe 2.6s ease forwards .6s}@keyframes wipe{to{width:78px}}
  </style>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1b2a52" flood-opacity="0.16"/></filter>
  <clipPath id="amt"><rect x="470" y="120" width="0" height="40" class="clip"/></clipPath></defs>

  <rect x="20" y="20" width="720" height="480" rx="20" fill="#ffffff" stroke="#e6ebf4" filter="url(#s)"/>
  <rect x="20" y="20" width="720" height="58" rx="20" fill="#0c1838"/><rect x="20" y="48" width="720" height="30" fill="#0c1838"/>
  <circle cx="48" cy="49" r="5" fill="#ff5f57"/><circle cx="66" cy="49" r="5" fill="#febc2e"/><circle cx="84" cy="49" r="5" fill="#28c840"/>
  <text x="120" y="54" fill="#fff" font-size="14" font-weight="700">Facturación · Resumen del mes</text>

  <!-- KPI cards -->
  <rect x="44" y="100" width="200" height="92" rx="14" fill="#f6f8fc" stroke="#eef1f6"/>
  <text x="62" y="126" fill="#8a93a6" font-size="11">Ingresos del mes</text>
  <text x="62" y="160" fill="#0b1020" font-size="26" font-weight="900">$ 18,240</text>
  <text x="62" y="180" fill="#16a34a" font-size="11" font-weight="700">▲ 12%</text>

  <rect x="262" y="100" width="180" height="92" rx="14" fill="#ecfdf5" stroke="#d6f5e6"/>
  <text x="280" y="126" fill="#0f766e" font-size="11">Pagado</text>
  <text x="280" y="160" fill="#0f766e" font-size="26" font-weight="900">92%</text>
  <rect x="280" y="172" width="140" height="8" rx="4" fill="#c7efdb"/><rect class="bar" x="280" y="172" width="129" height="8" rx="4" fill="#16a34a"/>

  <rect x="460" y="100" width="256" height="92" rx="14" fill="#0c1838"/>
  <text x="480" y="126" fill="#aab6d4" font-size="11">Recibo emitido</text>
  <text x="470" y="152" fill="#fff" font-size="26" font-weight="900" clip-path="url(#amt)">$ 1,250</text>
  <rect x="552" y="120" width="2.5" height="34" fill="#16a6ff" class="cur"/>
  <text x="480" y="178" fill="#8ea3d6" font-size="10.5">Familia Gómez · Mensualidad</text>

  <!-- table -->
  <text x="44" y="234" fill="#0b1020" font-size="13" font-weight="700">Últimos pagos</text>
  <g>
    <g class="rise" style="animation-delay:.5s"><rect x="44" y="248" width="672" height="46" rx="10" fill="#f9fbfe"/>
      <circle cx="72" cy="271" r="12" fill="#dbe6fb"/><rect x="96" y="262" width="150" height="8" rx="4" fill="#e6ebf4"/><rect x="96" y="276" width="90" height="7" rx="3" fill="#eef1f6"/>
      <rect x="560" y="262" width="60" height="18" rx="9" fill="#ecfdf5"/><text x="590" y="275" fill="#16a34a" font-size="10" font-weight="700" text-anchor="middle">Pagado</text>
      <text x="690" y="276" fill="#0b1020" font-size="12" font-weight="800" text-anchor="end">$ 320</text></g>
    <g class="rise" style="animation-delay:.66s"><rect x="44" y="302" width="672" height="46" rx="10" fill="#f9fbfe"/>
      <circle cx="72" cy="325" r="12" fill="#ccfbf1"/><rect x="96" y="316" width="170" height="8" rx="4" fill="#e6ebf4"/><rect x="96" y="330" width="80" height="7" rx="3" fill="#eef1f6"/>
      <rect x="560" y="316" width="60" height="18" rx="9" fill="#ecfdf5"/><text x="590" y="329" fill="#16a34a" font-size="10" font-weight="700" text-anchor="middle">Pagado</text>
      <text x="690" y="330" fill="#0b1020" font-size="12" font-weight="800" text-anchor="end">$ 450</text></g>
    <g class="rise" style="animation-delay:.82s"><rect x="44" y="356" width="672" height="46" rx="10" fill="#f9fbfe"/>
      <circle cx="72" cy="379" r="12" fill="#fdeccf"/><rect x="96" y="370" width="140" height="8" rx="4" fill="#e6ebf4"/><rect x="96" y="384" width="100" height="7" rx="3" fill="#eef1f6"/>
      <rect x="556" y="370" width="68" height="18" rx="9" fill="#fef3c7"/><text x="590" y="383" fill="#d97706" font-size="10" font-weight="700" text-anchor="middle">Pendiente</text>
      <text x="690" y="384" fill="#0b1020" font-size="12" font-weight="800" text-anchor="end">$ 280</text></g>
    <g class="rise" style="animation-delay:.98s"><rect x="44" y="410" width="672" height="46" rx="10" fill="#f9fbfe"/>
      <circle cx="72" cy="433" r="12" fill="#ede9fe"/><rect x="96" y="424" width="160" height="8" rx="4" fill="#e6ebf4"/><rect x="96" y="438" width="86" height="7" rx="3" fill="#eef1f6"/>
      <rect x="560" y="424" width="60" height="18" rx="9" fill="#ecfdf5"/><text x="590" y="437" fill="#16a34a" font-size="10" font-weight="700" text-anchor="middle">Pagado</text>
      <text x="690" y="438" fill="#0b1020" font-size="12" font-weight="800" text-anchor="end">$ 200</text></g>
  </g>
</svg>
